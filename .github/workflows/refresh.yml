name: Refresh gem data

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: browser-actions/setup-firefox@v1
      - run: firefox --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape poewiki (headless Firefox passes Cloudflare)
        run: python tools/fetch-poewiki.py

      - name: Rebuild data/gems.json
        run: node tools/gen-gems.cjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gems.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh gems.json from poewiki ($(date -u +%F))"
            git push
          fi
